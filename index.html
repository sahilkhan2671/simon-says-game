<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Simon Says Game</title>
</head>

<body>

    <div class="game">

        <!-- HEADER -->

        <header class="game-header">

            <div class="title-section">
                <p class="game-label">MEMORY CHALLENGE</p>
                <h1>Simon Says</h1>
            </div>

            <div class="best-score">
                <span>🏆 BEST</span>
                <strong id="best-score">0</strong>
            </div>

        </header>


        <!-- STATS -->

        <div class="stats">

            <div class="stat-box">
                <span>LEVEL</span>
                <strong id="level">0</strong>
            </div>

            <div class="stat-box">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>

        </div>


        <!-- MESSAGE -->

        <div class="message-box">

            <h2 id="message">
                Ready to test your memory?
            </h2>

            <p id="sub-message">
                Press Start or any key to begin
            </p>

        </div>


        <!-- GAME BUTTONS -->

        <div class="btn-container">

            <button
                class="btn red"
                id="red"
                data-color="red">

                <span>01</span>

            </button>


            <button
                class="btn yellow"
                id="yellow"
                data-color="yellow">

                <span>02</span>

            </button>


            <button
                class="btn green"
                id="green"
                data-color="green">

                <span>03</span>

            </button>


            <button
                class="btn purple"
                id="purple"
                data-color="purple">

                <span>04</span>

            </button>

        </div>


        <!-- START BUTTON -->

        <button id="start-btn" class="start-btn">
            ▶ Start Game
        </button>


        <!-- INSTRUCTIONS -->

        <div class="instructions">

            <span>💡</span>

            Watch the pattern carefully and repeat it!

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
